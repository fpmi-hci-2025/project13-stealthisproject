site_name: Railway Ticket System Docs
theme:
  name: material
  features:
    - content.code.copy

plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - "Lab 1: Analysis & Research":
      - Overview: lab1/lab1_report.md
