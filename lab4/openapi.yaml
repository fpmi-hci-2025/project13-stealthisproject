openapi: 3.0.0
info:
  title: Railway Ticket System API
  description: API для системы продажи железнодорожных билетов (БГУ ПЧМИ Лаб 4)
  version: 1.0.0
  contact:
    email: student@bsu.by
servers:
  - url: https://virtserver.swaggerhub.com/PROJECT13/railway-api/1.0.0
    description: Mock Server
  - url: http://localhost:8080/api/v1
    description: Local Development Server

tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Управление пользователями
  - name: Routes
    description: Поиск и просмотр рейсов
  - name: Orders
    description: Бронирование и покупка билетов

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пассажира
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации данных

  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Неверный email или пароль

  /users/me:
    get:
      tags:
        - Users
      summary: Получение профиля текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags:
        - Users
      summary: Обновление профиля
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /routes/search:
    get:
      tags:
        - Routes
      summary: Поиск рейсов
      parameters:
        - in: query
          name: from_city
          schema:
            type: string
          required: true
          description: Город отправления
        - in: query
          name: to_city
          schema:
            type: string
          required: true
          description: Город прибытия
        - in: query
          name: date
          schema:
            type: string
            format: date
          required: true
          description: Дата поездки
      responses:
        '200':
          description: Список найденных рейсов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteSearchResponse'

  /orders:
    post:
      tags:
        - Orders
      summary: Создание заказа (Бронирование)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags:
        - Orders
      summary: История заказов пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{id}/pay:
    post:
      tags:
        - Orders
      summary: Оплата заказа
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: ID заказа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Оплата успешна
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "PAID"
                  transactionId:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [PASSENGER, ADMIN]

    RegistrationRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        passportData:
          type: string

    RouteSearchResponse:
      type: object
      properties:
        routeId:
          type: integer
        trainNumber:
          type: string
        departureTime:
          type: string
          format: date-time
        arrivalTime:
          type: string
          format: date-time
        price:
          type: number
        availableSeats:
          type: integer

    CreateOrderRequest:
      type: object
      required:
        - routeId
        - seatId
      properties:
        routeId:
          type: integer
        seatId:
          type: integer
        passengerId:
          type: integer
          description: Опционально, если билет покупается для другого человека

    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
        totalAmount:
          type: number
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    Ticket:
      type: object
      properties:
        id:
          type: integer
        ticketNumber:
          type: string
        seatNumber:
          type: integer
        carriageNumber:
          type: integer
        price:
          type: number

    PaymentRequest:
      type: object
      required:
        - cardNumber
        - expiryDate
        - cvv
      properties:
        cardNumber:
          type: string
        expiryDate:
          type: string
        cvv:
          type: string

